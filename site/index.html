re, how to add one in Claude or ChatGPT, and the permission habits that keep your accounts safe.", "mins": 14, "body": null, "ext": true}, "connectors-worth-setting-up": {"title": "5 connectors worth setting up first", "excerpt": "Calendar, email, files, a task app and Zapier: the order to connect them, first prompts for each and safe permission habits.", "mins": 12, "body": null, "ext": true}, "creator-fit-scorer": {"title": "Creator Fit Scorer", "excerpt": "An open-source tool that ranks creators against a brief, explains every score and drafts a first outreach message.", "mins": 7, "body": null, "ext": true}, "everyday-life-prompts": {"title": "45 everyday AI prompts for normal life", "excerpt": "Fridge dinners, confusing letters, trip plans, hard messages and big decisions. 45 copy-paste prompts for the everyday jobs AI is actually good at.", "mins": 18, "body": null, "ext": true}, "gemini-inside-google": {"title": "The complete Gemini guide: AI inside the Google apps you already use (2026)", "excerpt": "Pick the right Gemini plan, set it up in 10 minutes, use it inside Gmail, Docs and Sheets, and try 44 ready-to-copy prompts.", "mins": 35, "body": null, "ext": true}, "growth-experiment-lab": {"title": "Growth Experiment Lab: read an A/B test honestly", "excerpt": "A free, open-source web page that reads an A/B test, plans how long to run one and ranks what to test next.", "mins": 7, "body": null, "ext": true}, "hidden-ai-features": {"title": "15 AI features most people never use", "excerpt": "Editing to branch, temporary chats, memory, projects, camera sharing, scheduled tasks and more, with where to find each in ChatGPT, Claude and Gemini.", "mins": 13, "body": null, "ext": true}, "job-search-agent": {"title": "The job-search agent I built for myself", "excerpt": "An open-source tool that reads live job boards, scores fit with evidence for every point and lints application text for AI tells.", "mins": 8, "body": null, "ext": true}, "marketing-attribution-lab": {"title": "Marketing Attribution Lab: stop trusting last click", "excerpt": "An open-source tool that runs six attribution models on the same customer journeys, so you can see where last click misleads.", "mins": 6, "body": null, "ext": true}, "one-line-follow-ups": {"title": "12 follow-ups that fix weak AI answers", "excerpt": "The first answer is a draft. These 12 one-line replies, sorted by the problem they fix, turn it into something you can use.", "mins": 15, "body": null, "ext": true}, "pick-your-ai-by-job": {"title": "ChatGPT, Claude or Gemini? Pick by job, not by hype", "excerpt": "A plain comparison by task, with October 2026 prices and a 20-minute side-by-side test, so you pay for one tool, not three.", "mins": 16, "body": null, "ext": true}, "projects-in-claude-and-chatgpt": {"title": "Projects in Claude and ChatGPT, explained", "excerpt": "Set up a Project in Claude, ChatGPT or Gemini in 30 minutes, with ready-to-paste instructions for five everyday situations.", "mins": 16, "body": null, "ext": true}, "report-that-writes-itself": {"title": "A weekly report that writes itself", "excerpt": "The sheet does the maths, the AI writes the words: a tested template, prompt and no-code schedule for a weekly report draft.", "mins": 15, "body": null, "ext": true}, "side-project-prompt-chain": {"title": "A 4-prompt chain to plan a side project", "excerpt": "Four prompts, run in order, take you from a vague idea to a cheap test and a first-week plan. No hype, no income promises.", "mins": 14, "body": null, "ext": true}, "issue-1": {"title": "Hi, I'm Vish. Here's what Build Notes is.", "teaser": "One guide, one prompt, one thing to try. Every Monday, in plain words.", "items": ["Who I am, in short", "What lands every Monday", "Prompt of the week: sort your week"], "body": "<p>Hi, I'm Vish.<\/p>\n\n<p>This is the first issue of Build Notes, the weekly newsletter that goes with Build with Vish. Below: who's writing, what you'll get every Monday, and a first prompt you can use before your coffee goes cold.<\/p>\n\n<h2>Who I am<\/h2>\n<p>I spent more than four years on the brand side of influencer marketing and brand management. I worked on 850+ creator deals and led teams. A lot of that job was briefs, shortlists, reports and the same careful work done by hand, week after week.<\/p>\n<p>Then I moved to Germany to do an MBA and started building practical AI tools and workflows. I'm not an engineer, and I don't write code by hand. I describe what I need, AI drafts it, and I make the decisions. I'm also job hunting in Germany, so one of the first things I built was <a href=\"#read-job-search-agent\">a job-search agent for my own search<\/a>.<\/p>\n<p>Most of my building happens in Claude, using Projects, Skills and connectors. When something turns out useful, I publish it as a small open-source tool on GitHub so anyone can use it.<\/p>\n\n<h2>Why this newsletter exists<\/h2>\n<p>Most AI advice is written for people who already like tech. I'm writing for the person who tried an AI chat once, got a bland answer and closed the tab.<\/p>\n<p>That bland answer is rarely the tool's fault alone. It usually comes from two habits: a vague request, and stopping at the first reply. Both are fixable in minutes, and neither needs code. That's what Build Notes is about: small, practical habits that turn AI into something you use every week for real work.<\/p>\n\n<h2>What lands every Monday<\/h2>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Part<\/th><th>What you get<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>One guide<\/td><td>A full step-by-step page on the site. The issue walks you through its core idea, so it's useful even if you never click.<\/td><\/tr>\n<tr><td>One prompt<\/td><td>Copy-ready, with [square brackets] where your details go.<\/td><\/tr>\n<tr><td>One thing to try<\/td><td>A task small enough to do the same day, usually 10 to 20 minutes.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Plain words, British spelling, euro examples. When I mention a feature, a menu or a price, it has been checked against the official help pages that month, and I'll say when. When AI is bad at something, I'll say that too.<\/p>\n\n<h2>What's coming next<\/h2>\n<p>The next five issues follow the order I'd teach a friend. First, how to brief AI properly so the first answer is closer to what you need. Then what to say when that answer is still weak. Then a topic from my old job: how I'd pick creators without staring at follower counts. After that, building a simple website with no code, and finally giving AI enough context about you that you stop repeating yourself in every chat.<\/p>\n\n<h2>Prompt of the week<\/h2>\n<p>Start with your to-do list. This prompt sorts it into what AI can draft for you, what you should do yourself, and what can go. Paste your real list. Messy is fine.<\/p>\n<pre class=\"prompt\" data-label=\"Prompt 1 · Sort my week\">Here's everything on my list this week: [paste your list, messy is fine].\n\nSort it into a table with three columns:\n1. AI can draft this: for each item, write the exact prompt I should use.\n2. I do this myself: add one line on why AI shouldn't do it.\n3. Drop, delay or hand off: say to whom or until when.\n\nIf an item is unclear, ask me about it before sorting. Don't guess.\n\nFinish with the one task that matters most by Friday, and why.<\/pre>\n<div class=\"callout warn\"><b>Privacy<\/b><p>Before you paste, take out passwords, bank details, ID numbers and other people's private information. \"Call A. about the invoice\" gives the AI all it needs.<\/p><\/div>\n\n<h2>Try this today<\/h2>\n<p>Run the prompt with this week's real list. Then pick one item from the \"AI can draft this\" column and run the prompt it wrote for you. Give the whole thing about 15 minutes.<\/p>\n<p>When the draft comes back, read it with one question in mind: what would I need to change before I'd send or use this? Write the answer down in a line. That gap between \"almost\" and \"usable\" is where most of the useful AI skills live, and it's exactly what the next two issues are about.<\/p>\n<div class=\"callout vish\"><b>My take<\/b><p>The \"I do this myself\" column matters as much as the first one. AI is good at drafts and first passes. Decisions, relationships and anything you'll be judged on still need you.<\/p><\/div>\n\n<p>If you're new to the site, <a href=\"#start\">Start here<\/a> is the best first stop. It points you to the guides worth reading first.<\/p>\n\n<p>See you next Monday,<br>Vish<\/p>\n"}, "issue-2": {"title": "Brief your AI like you'd brief a pro", "teaser": "Six boxes that turn average answers into usable drafts.", "items": ["Goal, audience, context, constraints, format, example", "The line that makes AI ask first", "Prompt of the week: the copy-paste brief"], "body": "<p>Hi, it's Vish.<\/p>\n\n<p>This week's idea: an AI fills every gap in your request with the most average guess. Leave out who it's for, and it writes for everyone. Leave out the length, and it picks a middle one. That's why so many answers feel fine and useless at the same time.<\/p>\n<p>I saw this on the creator side long before AI. In creator campaigns, most problems start with a vague brief. Send \"make something fun about our new product\" and you get something fun and wrong. The creator did nothing strange: they filled the gaps with their best guess. AI does the same, only faster and with more confidence.<\/p>\n\n<h2>The six boxes<\/h2>\n<p>The fix is the brief I used for creators, rewritten for AI. Six boxes, a line or two in each:<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Box<\/th><th>What goes in it<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Goal<\/td><td>One outcome you could check afterwards: \"After reading this, [who] will [do what].\"<\/td><\/tr>\n<tr><td>Audience<\/td><td>One typical reader: what they already know and what they care about right now.<\/td><\/tr>\n<tr><td>Context<\/td><td>What you know that the AI doesn't: background, what you tried, what flopped.<\/td><\/tr>\n<tr><td>Constraints<\/td><td>Limits as numbers and named words: \"under 120 words\", \"no exclamation marks\".<\/td><\/tr>\n<tr><td>Format<\/td><td>The exact shape: a table with named columns, three options, an email with a subject line.<\/td><\/tr>\n<tr><td>Example<\/td><td>Something close to what you want, plus what to copy and what to leave alone.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>If you only have time for two, fill Context and Example. Context is the detail only you know. Example shows tone, length and structure in one go, which no list of adjectives can do.<\/p>\n\n<h2>The line that makes AI ask first<\/h2>\n<p>End every brief with: \"Ask me up to 3 questions before you start.\" AI chat tools are built to answer straight away, even when your request has holes. This line gives permission to do what a good professional does with a fuzzy brief: ask. Three is enough to close the big gaps and few enough that you'll actually answer them.<\/p>\n<p>Reply in one message, numbered to match. Short answers are fine, and \"your call\" is a fine answer. The questions are also a free check on you. If the AI asks something you thought was obvious, that box was emptier than you realised.<\/p>\n\n<h2>What the difference looks like<\/h2>\n<p>Say you run a small pottery studio and you're launching your first six-week evening course.<\/p>\n<div class=\"compare\"><div class=\"bad\"><b>Weak<\/b><p>Write an email about my new pottery course.<\/p><\/div><div class=\"good\"><b>Better<\/b><p>Goal: fill 8 places on a 6-week Tuesday course. Audience: people who did a 2-hour taster and found the wheel hard. Context: afterwards they kept asking how to actually get good. Constraints: under 150 words, price stated clearly, one link.<\/p><\/div><\/div>\n<p>The weak version gets a cheerful email any studio could send, with \"Exciting news!\" in the subject line and no price. The better one can open with the exact question people asked after tasters. That opening only exists because you put it in the Context box.<\/p>\n\n<h2>Prompt of the week<\/h2>\n<p>Here's the whole brief as a template. Save it somewhere you can reach in two taps. Delete a box that truly doesn't apply, but think twice before deleting Context or Example.<\/p>\n<pre class=\"prompt\" data-label=\"Prompt 1 · The six-box brief\">GOAL: [one clear outcome: \"after reading this, [who] will [do what]\"]\n\nAUDIENCE: [who it's for, what they already know, what they care about right now]\n\nCONTEXT: [background, what you've tried, what didn't work, why now; paste real material where you can]\n\nCONSTRAINTS: [length, tone, language, words to avoid, must-include points, deadline]\n\nFORMAT: [exactly how the answer should be laid out: table and columns, number of options, bullets, email with subject line]\n\nEXAMPLE: [paste something close to what you want; say what to copy (tone, length, structure) and what NOT to copy]\n\nAsk me up to 3 questions before you start. If nothing is unclear, say so and go ahead.<\/pre>\n<div class=\"callout warn\"><b>Heads-up<\/b><p>A good brief shapes the answer. It doesn't make the facts true, so still check names, numbers, prices and anything legal. And keep passwords, ID numbers, bank details and other people's private information out of every box.<\/p><\/div>\n\n<h2>Try this today<\/h2>\n<p>Pick one real task you'd normally fire off as a one-liner: an email, a post, a short plan. Run the one-liner first and keep the answer. Then open a new chat, fill the six boxes (about 10 minutes) and send it with the magic line at the end. Answer its questions, then put the two results side by side.<\/p>\n<p>Last step: whatever the AI asked you, add the answer to your saved template. Next time you'll give it up front, and the brief gets faster every week.<\/p>\n<p>One honest limit: small things don't need six boxes. Converting €80 into dollars is a one-liner. Save the full brief for anything you'll send, publish or act on.<\/p>\n\n<p>The full guide goes box by box with weak and better versions, works the pottery email through to a first line, and has versions for writing, research, planning and images: <a href=\"#read-brief-ai-like-an-agency\">Brief AI the way you'd brief a pro<\/a>.<\/p>\n\n<p>See you next Monday,<br>Vish<\/p>\n"}, "issue-3": {"title": "The first answer is a draft", "teaser": "One-line follow-ups that turn a flat first answer into something you can use.", "items": ["Why reply #3 is the good one", "The assumption question", "A notes-app cheat sheet"], "body": "<p>Hi, it's Vish.<\/p>\n\n<p>Most people read the first AI answer, decide it's a bit flat and leave. This week's idea: that first answer is a draft. In my experience the useful one is usually reply #3, after you've told the AI what's wrong with the first.<\/p>\n<p>A good brief, the topic of <a href=\"#issue-2\">issue 2<\/a>, gets you a better first draft. It's still a draft. What turns it into something you can use is knowing what to say next, and that fits in one line.<\/p>\n\n<h2>Name the problem, then send the line<\/h2>\n<p>Before you reply, say in one word what's wrong with the answer. Each problem has a matching follow-up. Stay in the same chat, because the AI needs to see what it wrote, and send one or two lines at a time. Ask for five changes at once and you'll get a muddle.<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>If the answer is…<\/th><th>Type this<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Bloated<\/td><td>\"Half the words, same meaning.\"<\/td><\/tr>\n<tr><td>Generic<\/td><td>\"That's too generic. Ask me 3 questions about my situation first, then rewrite it.\"<\/td><\/tr>\n<tr><td>Suspiciously confident<\/td><td>\"What did you assume that I didn't tell you?\"<\/td><\/tr>\n<tr><td>Full of facts you can't check<\/td><td>\"Which part are you least sure about?\"<\/td><\/tr>\n<tr><td>Too agreeable<\/td><td>\"Now argue against it.\"<\/td><\/tr>\n<tr><td>Theory, no action<\/td><td>\"Turn this into steps I can do in the next hour.\"<\/td><\/tr>\n<tr><td>Stiff<\/td><td>\"Make it sound like a person talking.\"<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>That's seven of the twelve. The other five, and why each one works, are in the full guide.<\/p>\n\n<h2>The assumption question<\/h2>\n<p>If you keep only one, keep this: \"What did you assume that I didn't tell you?\"<\/p>\n<p>AI fills gaps quietly. It decides how many people you're cooking for, what your budget is and which country you live in, and it doesn't mention any of it. This question drags those guesses into the open so you can correct the wrong ones.<\/p>\n<div class=\"compare\"><div class=\"bad\"><b>Before<\/b><p>A weekly meal plan with salmon twice and a 40-minute dinner every night.<\/p><\/div><div class=\"good\"><b>After<\/b><p>\"I assumed you cook for two, eat fish and have about 40 minutes.\" You reply \"One person, no fish, 20 minutes max\" and get a plan you'll actually follow.<\/p><\/div><\/div>\n<p>The list of assumptions is often more useful than the answer, because it shows you what you forgot to say. I ask it before acting on any plan an AI gives me.<\/p>\n\n<h2>Why reply #3 is the good one<\/h2>\n<p>Here's a typical run. You ask for a plan to learn some Spanish before a holiday. <b>Reply 1<\/b> is a tidy eight-week plan that would suit anyone. You send the too-generic line. It asks your level, how much time you have each day and what you'll need Spanish for. You answer: total beginner, 15 minutes on the commute, ordering food and asking directions.<\/p>\n<p><b>Reply 2<\/b> is built around restaurant and street phrases and sized for the commute. Good, but long. You send \"Turn this into steps I can do in the next hour.\" <b>Reply 3<\/b> is today's first session: ten phrases, a way to practise them out loud and a two-minute self-test. That's the one you use.<\/p>\n<p>Two or three follow-ups is usually enough. If you're on reply 8 and still unhappy, the brief is the problem. Open a new chat, paste the best version so far and brief it properly.<\/p>\n\n<h2>Prompt of the week<\/h2>\n<p>The longer version of the assumption question. It ranks the guesses by how much they changed the answer, so you fix the big ones first.<\/p>\n<pre class=\"prompt\" data-label=\"Prompt 1 · Hidden assumptions\">What did you assume that I didn't tell you?\n\nList each assumption. For each one, say whether it changed your answer a lot or a little, and what you'd change if it's wrong.\n\nThen stop and wait for my corrections before you rewrite anything.<\/pre>\n<div class=\"callout warn\"><b>Heads-up<\/b><p>Follow-ups fix the shape of an answer, not its facts. Asking again can give you a different wrong answer, and AI tends to give way the moment you push back, even when it was right. Ask for reasons instead: \"Explain why, and tell me if you still think your first answer was correct.\" For money, health, legal or tax questions, treat the result as a draft and check with a qualified person when it matters.<\/p><\/div>\n\n<h2>Try this today<\/h2>\n<p>Open the last chat where you used AI for something real. Send \"What did you assume that I didn't tell you?\" and read the list slowly. Correct anything that's wrong and ask for a rewrite. Compare the new answer with the old one.<\/p>\n<p>Then copy the table above into your phone's notes app, so the right line is one tap away the next time an answer feels flat. Ten minutes, start to finish.<\/p>\n\n<p>All twelve follow-ups, each with why it works and a before and after, plus eight more worth keeping: <a href=\"#read-one-line-follow-ups\">12 follow-ups that fix weak AI answers<\/a>.<\/p>\n\n<p>See you next Monday,<br>Vish<\/p>\n"}, "issue-4": {"title": "Stop picking creators by follower count", "teaser": "The five-factor fit score, and the two checks AI still can't do for you.", "items": ["The 30/25/20/15/10 rubric", "A shortlist prompt and a reusable sheet", "The two checks only humans can do"], "body": "<p>Hi, it's Vish.<\/p>\n\n<p>This one is for anyone who picks creators for a brand, a shop or a client. Follower count is the easiest number to see and the least useful one to choose on. In more than four years and 850+ creator deals on the brand side, the creators who delivered were rarely the biggest accounts. They were the best fit.<\/p>\n\n<h2>Why follower count misleads<\/h2>\n<p>A follower count tells you how many people pressed follow at some point. It doesn't tell you who they are, whether they still watch or whether they'd care about your product. Two numbers sitting right next to it tell you far more: average views on recent posts, and who the audience actually is.<\/p>\n<p>Here's a made-up example. Creator A has 250,000 followers, gets about 12,000 views per post and charges €2,000. Creator B has 40,000 followers, gets about 15,000 views and charges €600. A costs about €167 per 1,000 views. B costs €40. If B's audience also matches your brief, the smaller account is the better buy by a wide margin.<\/p>\n\n<h2>The five-factor fit score<\/h2>\n<p>Score every creator from 1 to 10 on five factors, then weight them:<\/p>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>Factor<\/th><th>Weight<\/th><th>What to look at<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Audience fit<\/td><td>30%<\/td><td>Country, age range, language and interests of their followers, compared with your brief<\/td><\/tr>\n<tr><td>Content fit<\/td><td>25%<\/td><td>Would your product look natural in their last 12 posts?<\/td><\/tr>\n<tr><td>Engagement health<\/td><td>20%<\/td><td>Real comments, steady numbers, no sudden spikes<\/td><\/tr>\n<tr><td>Cost<\/td><td>15%<\/td><td>Rate compared with likely views: the cost per 1,000 views<\/td><\/tr>\n<tr><td>Brand safety<\/td><td>10%<\/td><td>Past controversies, recent competitor deals, tone<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Audience fit carries the most weight because a great creator with the wrong audience is still the wrong creator. Brand safety carries the least because it works more like a gate: a serious red flag rules someone out however well they score elsewhere.<\/p>\n<p>For the total, multiply each score by its weight and add them up. A creator scoring 8, 7, 6, 9 and 9 gets 2.4 + 1.75 + 1.2 + 1.35 + 0.9 = 7.6 out of 10.<\/p>\n<p>The weights are a starting point. A campaign where reach matters most might push Cost up. A sensitive product category might push Brand safety up. Change them per campaign, and write down why.<\/p>\n\n<h2>Prompt of the week<\/h2>\n<p>AI is good at the first pass: reading your notes, applying the weights the same way every time and spotting patterns across twenty creators. Give it the brief and whatever numbers you have.<\/p>\n<pre class=\"prompt\" data-label=\"Prompt 1 · The creator shortlist\">Help me shortlist creators for this brief: [product, campaign goal, target audience, country, budget in €].\n\nScore each creator from 1 to 10 on:\n- audience fit (30%)\n- content fit (25%)\n- engagement health (20%)\n- cost, based on rate per 1,000 average views (15%)\n- brand safety (10%)\n\nShow a table with each score, the weighted total out of 10, one sentence of reasoning per creator and a red-flag column. Rank them, then tell me which 2 you'd drop first and why.\n\nUse only the information I give you. Where data is missing, write \"unknown\" and don't guess. Don't guess anyone's personal traits from photos or names.\n\nCreators: [name, platform, followers, average views on last 10 posts, rate in €, audience stats they shared, notes on recent posts]<\/pre>\n\n<h2>The two checks only humans can do<\/h2>\n<p>AI can't see a creator's private audience data, and it can't tell whether comments or followers were bought. Both need a person.<\/p>\n<ol>\n<li><b>Ask for the audience screenshots.<\/b> Creators can see their own audience stats in their platform's analytics. You can't. Ask for screenshots of the countries, age ranges and recent reach, and score Audience fit from those, not from what the feed looks like.<\/li>\n<li><b>Read the comments yourself.<\/b> Scroll the comments on a few recent posts. Real comments mention the content, ask questions and sometimes disagree. Warning signs: lots of emoji-only or generic praise, the same handful of accounts every time, comments that don't match the post. A score can't tell you whether the people are real. Ten minutes of reading usually can.<\/li>\n<\/ol>\n<p>Then correct the AI's scores wherever you disagree. Your judgement is the final layer. The score is a way to compare, not a verdict.<\/p>\n<div class=\"callout warn\"><b>Heads-up<\/b><p>Once you've picked someone, paid posts need clear ad labels. <a href=\"#read-ad-labels-in-europe\">Ad labels in Europe<\/a> covers the basics. It's general information, not legal advice, so check anything contract-related with a professional.<\/p><\/div>\n\n<h2>Try this today<\/h2>\n<p>Take three creators you're considering, or three you follow if you're just practising. For each, note followers, average views on the last 10 posts and their rate if you know it. Work out cost per 1,000 views: rate ÷ average views × 1,000. Then read the comments on two recent posts each. It takes about 20 minutes. See whether your ranking still matches the one follower count gave you.<\/p>\n\n<p>The full rubric, with each factor explained: <a href=\"#read-shortlist-creators-with-ai\">Shortlist creators with AI, not follower counts<\/a>. Want it as a reusable sheet, with the weights in cells and red flags highlighted? Follow <a href=\"#read-creator-scorer-sheet\">Build a creator scorer in Google Sheets<\/a>.<\/p>\n\n<p>See you next Monday,<br>Vish<\/p>\n"}, "issue-5": {"title": "I built a website without writing code", "teaser": "Words first, one file, then live with Netlify Drop. The order that saves an evening.", "items": ["Words before design", "The single-file trick", "Going live with Netlify Drop"], "body": "<p>Hi, it's Vish.<\/p>\n\n<p>I'm not an engineer, and I don't write code by hand. AI writes it. I bring the words and make the calls. This week: how to get a simple one-page website live that way, with a link you can share, in about an hour.<\/p>\n<p>The mistake that wastes the most time is asking AI for a design before you know what the site should say. You get a lovely layout full of placeholder text, then spend the evening asking for changes because nothing fits your real words. Do it in the other order.<\/p>\n\n<h2>1. Words before design<\/h2>\n<p>Decide the one job of your site first. Get hired, sell a service, collect emails or show your work: pick one. Write it as a single sentence, for example \"Help café owners in my area book me for menu photos.\"<\/p>\n<p>Then write the content before you think about colours: a headline, a two-line intro, three short sections, some proof (projects, numbers, a quote you have permission to use) and one clear next step such as \"Email me\". Let AI interview you for it. Ask it to \"interview me one question at a time to write the content for a one-page website whose job is [your sentence]\". Answering questions is far easier than facing a blank page.<\/p>\n\n<h2>2. The single-file trick<\/h2>\n<p>When you ask AI to build the site, ask for <b>one single HTML file<\/b> with everything inside it. HTML is the language web pages are written in. A single file means the layout, colours and text all travel together: nothing to install and no separate pieces to lose. That one file is a complete website.<\/p>\n<p>Review it on your phone first, since that's where most visitors will see it. Then ask for changes in rounds: structure first, then words, then small details. One round at a time works far better than ten changes in one message.<\/p>\n<p>When you're happy, download the file, or copy the code into a new plain-text file. Name it <code>index.html<\/code>. Web hosts treat a file with that name as your home page. Put it alone in a folder named after your site.<\/p>\n\n<h2>3. Going live with Netlify Drop<\/h2>\n<p>Netlify is a hosting service: it puts your files on the internet. Its Drop page lets you do that by dragging a folder into your browser.<\/p>\n<ol>\n<li>Sign in to Netlify, or create a free account. You can drop without an account, but the site then sits behind a temporary password until you claim it by signing up.<\/li>\n<li>Open <a href=\"https://app.netlify.com/drop\" target=\"_blank\" rel=\"noopener\">Netlify Drop<\/a> in an up-to-date Chromium-based browser such as Chrome or Edge. A laptop is easiest.<\/li>\n<li>Drag your folder onto the drop area. A zip of the folder works too.<\/li>\n<li>After a few seconds you get a live link ending in <code>netlify.app<\/code>. Open it on your phone.<\/li>\n<li>For a nicer link, open your project overview, choose Customize, then \"Manage project name and cover image\". The project name becomes your address, like yourname.netlify.app.<\/li>\n<\/ol>\n<p>To update the site later, ask AI for the change, save the new <code>index.html<\/code> in the same folder and drag the folder onto the Production deploys area of your project dashboard.<\/p>\n<p class=\"note\">Checked in October 2026 against Netlify's <a href=\"https://docs.netlify.com/start/quickstarts/netlify-drop-quickstart/\" target=\"_blank\" rel=\"noopener\">Drop quickstart<\/a>. If a button has moved, search Netlify's docs for \"Netlify Drop\".<\/p>\n<div class=\"callout warn\"><b>Heads-up<\/b><p>Everything on your site is public. Leave off your home address, private phone number and ID details. Before you add a contact form or collect emails, read the <a href=\"#launch\">launch checklist<\/a>.<\/p><\/div>\n\n<h2>Prompt of the week<\/h2>\n<p>Use this once your words are written. It asks for one file, sets the style in a few words and makes the AI check what's missing before it builds.<\/p>\n<pre class=\"prompt\" data-label=\"Prompt 1 · Build my one-page site\">Build my one-page website as a single HTML file, with all the styling inside the file.\n\nJob of the site: [your one sentence]\nContent: [paste your headline, intro, sections, proof and contact details]\nStyle: [3 words, e.g. calm, bold, warm], with [one colour] as the accent.\n\nMust: work well on phones, load fast, have a light and a dark mode, and use only my real text (no placeholder text).\nAvoid: a stock-photo look, lots of animation, everything centred.\n\nBefore you build, ask me up to 3 questions if anything important is missing. After you build, tell me the 3 things you'd improve first.<\/pre>\n\n<h2>Try this today<\/h2>\n<p>Don't build yet. Spend 20 minutes on step 1 only: write the one-sentence job, then let AI interview you and draft the words. Read them out loud. If you'd be happy for a stranger to read them, you're ready, and the build itself will go much faster when you sit down to do it.<\/p>\n\n<p>The full project, step by step, with every prompt and fixes for when it gets stuck: <a href=\"#read-build-website-no-code\">Build your own website with AI, no code<\/a>.<\/p>\n\n<p>See you next Monday,<br>Vish<\/p>\n"}, "issue-6": {"title": "Make AI stop asking who you are", "teaser": "Four short files that give every chat your context from the first message.", "items": ["The four-file about-me folder", "Why 'current' is the file that matters", "Prompt of the week: the monthly refresh"], "body": "<p>Hi, it's Vish.<\/p>\n\n<p>A common complaint about AI: \"It doesn't get me.\" Fair enough. In a fresh chat it knows nothing about you, so you either explain yourself again every time or get answers written for a stranger. This week's fix takes about 30 minutes, once: a small folder of four files that tells AI who you are.<\/p>\n\n<h2>The four files<\/h2>\n<div class=\"table-wrap\"><table>\n<thead><tr><th>File<\/th><th>What goes in it<\/th><th>Update<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>about-me<\/td><td>Who you are, what you do, your goals and your limits (time, budget, the country you live in)<\/td><td>Rarely<\/td><\/tr>\n<tr><td>voice<\/td><td>How you write: sentence length, words you use and avoid, a couple of short samples<\/td><td>Rarely<\/td><\/tr>\n<tr><td>current<\/td><td>3 to 5 things you're working on, each with a goal, a deadline and what's blocking it<\/td><td>Monthly<\/td><\/tr>\n<tr><td>preferences<\/td><td>How you like answers: lead with the answer, keep it short, tables for comparisons, say when unsure<\/td><td>When something annoys you<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Plain documents are fine. Keep each one to about a page. Short and specific works better than long and complete, because the AI has to apply all of it to every answer.<\/p>\n\n<h2>How to build it<\/h2>\n<ol>\n<li><b>Let AI interview you for about-me.<\/b> Ask it to interview you one question at a time about your work, goals and constraints, then write the file in short bullet points. Answering questions is quicker than writing about yourself.<\/li>\n<li><b>Build voice from your own writing.<\/b> Paste three things you wrote and were happy with, and ask for a voice guide: traits, words you use, words you avoid. <a href=\"#read-brand-voice-without-ai-sound\">Make AI write in your voice<\/a> goes much deeper.<\/li>\n<li><b>Write current by hand.<\/b> It's the shortest file, and only you know what's really on your plate.<\/li>\n<li><b>Write preferences from your pet peeves.<\/b> Every answer that annoys you is a line for this file. \"Stop opening with a compliment\" counts.<\/li>\n<li><b>Put the files where the AI can read them.<\/b> Claude and ChatGPT both have Projects: a space with its own files and instructions. Add the four files there and start your chats inside it. In other apps, attach the files at the start of a chat.<\/li>\n<li><b>Test it.<\/b> Ask: \"What do you know about me, and what should I focus on this week?\" If something's wrong, fix the file, not the chat.<\/li>\n<\/ol>\n\n<h2>Why \"current\" is the file that matters<\/h2>\n<p>About-me and voice barely change. Current goes stale fast, and a stale current file can be worse than none: the AI keeps steering you towards a project you finished or dropped weeks ago, and you won't always notice.<\/p>\n<p>It's also the file that makes answers feel personal. \"Help me plan my week\" means something very different when the AI knows you have an exam on the 20th and a half-finished website. So the habit that keeps the whole folder useful is small: once a month, refresh current. Five minutes.<\/p>\n<div class=\"callout warn\"><b>Privacy<\/b><p>Keep these files boring on purpose. No passwords, ID or passport numbers, bank details or health information, and nothing private about other people. \"Partner, two kids, free evenings are rare\" is all the context the AI needs. It's also worth checking your app's data settings: <a href=\"#read-ai-privacy-settings\">Five privacy settings to check<\/a>.<\/p><\/div>\n\n<h2>Prompt of the week<\/h2>\n<p>Set a monthly reminder, then paste this with last month's current file. The AI asks the questions, so you don't have to remember what changed.<\/p>\n<pre class=\"prompt\" data-label=\"Prompt 1 · The monthly refresh\">Here's my \"current\" file from last month: [paste it].\n\nHelp me update it. Ask me 5 questions, one at a time, about what I finished, what I dropped, what's new and what's blocking me now. Wait for each answer before asking the next question.\n\nThen rewrite the file:\n- 3 to 5 current projects, each with one line for the goal, the deadline and what's blocking it\n- remove anything finished or dropped\n- under one page, in short bullet points\n\nFinally, list what you removed so I can check nothing important went missing.<\/pre>\n\n<h2>Try this today<\/h2>\n<p>Write just the current file. Open a blank note and list three to five things on your plate, one line each: goal, deadline, blocker. That's about 10 minutes.<\/p>\n<p>Paste it at the top of your next AI chat, before your actual question, and compare the answer with what you usually get. Then put a monthly reminder in your calendar called \"refresh current\", with the prompt above saved in the reminder's notes.<\/p>\n\n<p>The full project, file by file, with every prompt and a test to check it worked: <a href=\"#read-ai-about-me-folder\">Build an about-me folder so AI knows you<\/a>.<\/p>\n\n<p>See you next Monday,<br>Vish<\/p>\n"}};
[GUIDES, PROJECTS, ISSUES].forEach((arr) => arr.forEach((x) => { const L = LONG[x.slug]; if (L) Object.assign(x, L); }));

<script>
/* ===== Build with Vish: cinematic WebGL journey v7 (Three.js r128). Clean: near-black space, one hero piece per chapter that
   assembles as you arrive, reacts to the cursor and can be spun by dragging. ===== */
window.Journey = (function () {
  "use strict";
  if (typeof THREE === "undefined") return null;
  const HAS_GL = (() => { try { const c = document.createElement("canvas"); return !!(window.WebGLRenderingContext && (c.getContext("webgl2") || c.getContext("webgl"))); } catch (e) { return false; } })();
  const coarse = matchMedia("(pointer: coarse)").matches;
  const small = () => innerWidth < 760;
  const MOBILE = coarse || small();
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const C = (h) => new THREE.Color(h);
  const IRIS = C("#A99CFF"), AUR = C("#6FE0D2"), SOL = C("#F3C584"), STAR = C("#EEF0FF");
  const IRIS_D = C("#5546D8"), INK_D = C("#2A2F5C"), AUR_D = C("#0E8C80");
  const BG_N = C("#04050F"), BG_D = C("#E2DBE6"), ABYSS_N = C("#02101A"), MIST_D = C("#D7DCE5");
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

  function setPtr(e) { if (homeOn && glReady) window.Journey.pointer((e.clientX / innerWidth) * 2 - 1, -((e.clientY / innerHeight) * 2 - 1), true); }
  addEventListener("pointermove", setPtr, { passive: true }); addEventListener("pointerdown", setPtr, { passive: true });
  document.addEventListener("pointerleave", () => { if (homeOn && glReady) window.Journey.pointer(9, 9, false); });
  let lastY = 0, lastYv = 0;
  function onScroll() {
    const y = scrollY, nav = $("#nav");
    if (y > 240 && y > lastY + 4 && !$(".sheet")) nav.classList.add("hide"); else if (y < lastY - 4 || y < 240) nav.classList.remove("hide");
    lastY = y;
    const pr = $("#prog"); if (!pr.hidden) { const m = document.documentElement.scrollHeight - innerHeight; pr.style.width = (m > 0 ? (y / m) * 100 : 0) + "%"; }
    if (!homeOn) return;
    const j = $("#journey"); if (!j) return;
    const r = j.getBoundingClientRect(), chs = $$(".chapter", j), vc = innerHeight / 2;
    const cs = chs.map((el) => { const b = el.getBoundingClientRect(); return b.top + b.height / 2; });
    let f = 0; if (vc >= cs[cs.length - 1]) f = cs.length - 1; else if (vc > cs[0]) { for (let k = 0; k < cs.length - 1; k++) if (vc >= cs[k] && vc < cs[k + 1]) { f = k + (vc - cs[k]) / (cs[k + 1] - cs[k]); break; } }
    const p = f / (cs.length - 1);

    const ch = Math.round(p * (CHAPTERS.length - 1));
    $("#ro-bar").style.height = p * 100 + "%";
    Sound.depth(clamp((p - 0.05) / 0.95));
    if (!lenis && glReady) { window.Journey.velocity(y - lastYv); Sound.scroll((y - lastYv) * 10); } lastYv = y;
    $("#hint").style.opacity = y > 40 ? 0 : 1;
    const past = r.bottom < innerHeight * 0.55; document.body.classList.toggle("past", past); $("#hud").classList.toggle("off", past);
    const fade = clamp(r.bottom / innerHeight); $("#stage").style.opacity = 0.15 + fade * 0.85;
    if (glReady) { if (fade <= 0.02) window.Journey.stop(); else window.Journey.start(); }
    if (ch !== lastCh) {
      lastCh = ch; const c = CHAPTERS[ch];
      $("#ro-n").textContent = c.n; scramble($("#ro-name"), c.name.toUpperCase());
      $$(".hud .rail button").forEach((b, i) => (i === ch ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current")));
      $$(".chapter").forEach((el, i) => el.classList.toggle("on", i === ch));

  }
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", onScroll);

  function loader() {
    const l = document.createElement("div"); l.className = "loader"; l.setAttribute("aria-hidden", "true");
    l.innerHTML = `<div class="lw">${"Build with Vish".split("").map((c, i) => `<span style="--i:${i}">${c === " " ? "&nbsp;" : c}</span>`).join("")}</div><div class="lb"><i id="lbi"></i></div><div class="lp" id="ln">0</div>`;
    document.body.appendChild(l);
    const st = performance.now(), dur = RM ? 200 : 1700; let finished = false;
    return new Promise((res) => {
      (function t(n) { const k = clamp((n - st) / dur), v = Math.round((1 - Math.pow(1 - k, 3)) * 100); $("#ln", l).textContent = v; $("#lbi", l).style.transform = `scaleX(${v / 100})`; if (k < 1) requestAnimationFrame(t); else if (!finished) { finished = true; res(); l.classList.add("done"); setTimeout(() => l.remove(), 1300); } })(st);
    });
  }

  /* ================= ROUTER ================= */
  const cleanups = [];
  let firstRoute = true, curKey = null;
  async function route() {
    const raw = (location.hash || "#home").slice(1) || "home";
    if (raw.startsWith("c-")) { if (curKey !== "carousels") { history.replaceState(null, "", "#carousels"); await render("carousels"); } openDeck(raw.slice(2)); return; }
    if ((raw === "home-play" || raw === "home-quiz" || raw === "home-connect") && curKey === "home") { goTo(document.getElementById(raw)); return; }
    if (/^s-\d+$|^step-\d+$/.test(raw)) return;
    if (raw.startsWith("read-")) loadBody(find(raw.slice(5))).catch(() => {});
    const doWipe = !firstRoute && !RM;
    if (doWipe) { const w = $("#wipe"); w.style.setProperty("--x", lastPt[0] + "px"); w.style.setProperty("--y", lastPt[1] + "px"); w.classList.remove("go"); void w.offsetWidth; w.classList.add("go"); Sound.whoosh(); setTimeout(() => w.classList.remove("go"), 1150); await new Promise((r) => setTimeout(r, 480)); }
    await render(raw);
  }
  async function render(raw) {
    cleanups.splice(0).forEach((f) => f()); killTriggers();
    let key = raw, html, after = null, isHome = false, prog = false, scrollTo = null;
    if (raw === "home" || raw === "home-play" || raw === "home-quiz" || raw === "home-connect") { key = "home"; isHome = true; html = vHome(); if (raw !== "home") scrollTo = raw; }
    else if (raw === "start") html = vStart();
    else if (raw === "guides" || raw.startsWith("guides-")) { key = "guides"; const t = raw.slice(7); html = vGuides(TYPES.some((x) => x.id === t) ? t : null); after = bindGuides; }
    else if (raw.startsWith("read-") && find(raw.slice(5))) {
      const a = find(raw.slice(5)); key = a.type === "project" ? "projects" : "guides";
      let ok = true; try { await loadBody(a); } catch (e) { ok = false; }
      if (ok) { html = vRead(a); after = () => bindRead(a); prog = true; document.title = a.title + " | Build with Vish"; }
      else { html = `<div class="wrap pg"><div class="phead"><h1>This guide didn't load.</h1><p class="lead">Probably a connection hiccup. Check you're online, then try again.</p><p style="margin-top:20px"><button class="btn pri" type="button" id="retry">Try again</button> <a class="btn" href="#guides">All guides</a></p></div></div>`; after = () => $("#retry").addEventListener("click", () => render(raw)); }
    }
    else if (raw.startsWith("issue-") && ISSUES.find((i) => i.slug === raw)) { key = "newsletter"; html = vIssue(ISSUES.find((i) => i.slug === raw)); prog = true; }
    else if (raw === "projects") html = vProjects();
    else if (raw === "carousels") { html = vCarousels(); after = () => $$("[data-open]").forEach((b) => b.addEventListener("click", () => openDeck(b.dataset.open))); }
    else if (raw === "newsletter") html = vNewsletter();
    else if (raw === "tools") { html = vTools(); after = () => quiz($("#quiz")); }
    else if (raw === "partner") html = vPartner();
    else if (raw === "about") html = vAbout();
    else if (raw === "portfolio") { html = vPortfolio(); after = bindPortfolio; }
    else if (raw === "launch") { html = vLaunch(); after = bindLaunch; }
    else if (raw === "legal") html = vLegal();
    else { key = "home"; isHome = true; html = vHome(); }
    if (!prog) document.title = isHome ? "Build with Vish" : (NAV.find((n) => n[0] === key) || [0, key === "start" ? "Start here" : key === "tools" ? "AI tool finder" : key === "partner" ? "Partner" : key === "launch" ? "Before you launch" : "Imprint"])[1] + " | Build with Vish";
    curKey = key;
    const main = $("#main");
    document.body.classList.toggle("cine", isHome);
    main.className = isHome ? "" : "page";
    main.innerHTML = html;
    $$(".links a").forEach((a) => (a.dataset.nav === key ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
    $("#prog").hidden = !prog; $("#prog").style.width = 0;
    enhance(main);
    $$("[data-copy]", main).forEach((b) => b.addEventListener("click", () => copy(b.dataset.copy, b)));
    if (after) after();
    reveals(main);
    if (isHome) {
      if (firstRoute && !RM) { $("#stage").hidden = false; const ld = loader(); await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 30))); homeInit(); await ld; setTimeout(gate, 950); }
      else { homeInit(); if (firstRoute) gate(); }
    } else homeOff();
    if (!firstRoute && !raw.startsWith("home-")) { const m = $("#main"); if (m) m.focus({ preventScroll: true }); } // keyboard and screen-reader users land on the new page
    firstRoute = false;
    if (scrollTo) requestAnimationFrame(() => { const el = document.getElementById(scrollTo); if (!el) return; if (lenis) lenis.scrollTo(el, { immediate: true, offset: -20 }); else el.scrollIntoView({ behavior: "auto" }); });
    else scrollTo0();
    $("#nav").classList.remove("hide");
  }
  function scrollTo0() { if (lenis) { lenis.scrollTo(0, { immediate: true }); return; } const b = document.documentElement.style.scrollBehavior; document.documentElement.style.scrollBehavior = "auto"; window.scrollTo(0, 0); document.documentElement.style.scrollBehavior = b; }
  addEventListener("hashchange", route);
  shell(); setupSmooth(); route();
})();
