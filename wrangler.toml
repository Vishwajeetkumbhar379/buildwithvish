# Cloudflare Workers config (Vish moved the site off Netlify on 15 Oct 2026: free plan, no per-deploy credits).
# The site is pre-built into /site by `python3 src/build.py` and served as static assets (free, unmetered). Only
# /api/* runs the Worker (worker/index.js -> functions/api/*.js). Pushes to main deploy through Workers Builds
# (dashboard: build command empty, deploy command `npx wrangler deploy`).
# Secrets (set in the Cloudflare dashboard as type Secret, never here): MAILERLITE_API_TOKEN, IG_ACCESS_TOKEN,
# IG_APP_SECRET, IG_VERIFY_TOKEN, PARTNER_TO. Partner emails also need the [[send_email]] binding below once Email
# Routing is on for buildwithvvish.com (uncomment it then).
name = "buildwithvish"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "site"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
# MailerLite group "Build Notes" (an ID, not a credential)
MAILERLITE_GROUP_ID = "200569962967860964"

[observability]
enabled = true

# [[send_email]]
# name = "MAIL"
