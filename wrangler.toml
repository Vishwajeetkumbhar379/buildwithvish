# Cloudflare Workers config (Vish moved the site off Netlify on 15 Oct 2026: free plan, no per-deploy credits).
# The site is pre-built into /site by `python3 src/build.py` and served as static assets (free, unmetered). Only
# /api/* runs the Worker (worker/index.js -> functions/api/*.js). Pushes to main deploy through Workers Builds
# (dashboard: build command empty, deploy command `npx wrangler deploy`).
# Secrets (set in the Cloudflare dashboard as type Secret, never here): MAILERLITE_API_TOKEN, IG_ACCESS_TOKEN,
# IG_APP_SECRET, IG_VERIFY_TOKEN, PARTNER_TO, STATS_TOKEN (for /api/autodm-stats). Partner emails also need the [[send_email]] binding below once Email
# Routing is on for buildwithvvish.com (uncomment it then).
name = "buildwithvish"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "site"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/go/*"]

[vars]
# MailerLite group "Build Notes" (an ID, not a credential)
MAILERLITE_GROUP_ID = "200569962967860964"

[observability]
enabled = true

# Instagram comment-to-DM storage (dedupe, counters). No database_id on purpose: wrangler (4.45+) creates the D1
# database on the first deploy and links it (automatic provisioning; the ID then shows in the dashboard, not here).
# Free plan: 100,000 row writes a day. Tables are created by the code on first use.
[[d1_databases]]
binding = "DB"
database_name = "buildwithvish-autodm"

# Daily clean-up of expired dedupe rows (free plan includes cron triggers).
[triggers]
crons = ["17 3 * * *"]

# [[send_email]]
# name = "MAIL"
